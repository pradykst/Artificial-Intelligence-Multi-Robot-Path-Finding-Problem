[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-pathfinding"
version = "0.1.0"
description = "Single-robot A* search on rectangular grids"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.7,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
